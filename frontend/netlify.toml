[build]
  command = "npm run build"
  publish = "build"

# React Router (CRA) のクライアントサイドルーティングに対応するため、
# 全パスを index.html にフォールバックさせる
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html はキャッシュしない（OGPをクローラーに確実に届けるため）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 静的アセット（JS/CSS/画像）は長期キャッシュ
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
