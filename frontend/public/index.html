<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080810" />

    <!-- Webフォント（Orbitron / Noto Sans JP）
         - 以前は index.css の @import で読んでおり、「HTML→CSS→フォントCSS→フォント」の
           順番待ちで初回表示が約5秒止まっていた（PageSpeed 2026-10-27）
         - 接続を先に張り（preconnect）、フォントCSSは表示を止めない形で読む
           （media="print" で取得し、読み込み後に all へ切り替え）。届くまでは代替フォントで表示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" />
    </noscript>

    <!-- Google AdSense（サイト所有権確認 + 広告配信の土台） -->
    <meta name="google-adsense-account" content="ca-pub-2799507261826956" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2799507261826956"
      crossorigin="anonymous"></script>

    <!-- サイト説明 -->
    <meta name="description" content="SONICLIST #1 — アニソンプレイリストを作って共有しよう" />

    <!-- OGP (Facebook / LINE / Discord etc.) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="SONICLIST #1" />
    <meta property="og:title"       content="SONICLIST #1" />
    <meta property="og:description" content="アニソンプレイリストを作って共有しよう" />
    <meta property="og:url"         content="https://soniclist.app" />
    <meta property="og:image"       content="https://soniclist.app/ogp.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SONICLIST #1" />
    <meta name="twitter:description" content="アニソンプレイリストを作って共有しよう" />
    <meta name="twitter:image"       content="https://soniclist.app/ogp.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>SONICLIST #1</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
